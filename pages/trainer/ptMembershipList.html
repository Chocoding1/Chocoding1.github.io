<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>진행 중인 PT 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/axiosInstance.js"></script>
    <style>
        .container {
            max-width: 800px;
            margin-top: 30px;
        }
        .pt-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pt-info {
            flex-grow: 1;
        }
        .btn-review {
            white-space: nowrap;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4">진행 중인 PT 목록</h2>

    <!-- PT 목록 반복 출력 -->
    <div id="pt-list"></div>

    <!-- PT가 없는 경우 -->
    <p id="no-pt" class="text-center text-muted d-none">진행 중인 PT가 없습니다.</p>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const userId = localStorage.getItem('userId');

            const response = await axiosInstance.get(`normembers/${userId}/ptmemberships`);

            const ptList = response.data.data;
            const ptContainer = document.getElementById("pt-list");
            const noPtMessage = document.getElementById("no-pt");

            if (ptList.length === 0) {
                noPtMessage.classList.remove("d-none");
                return;
            }

            ptList.forEach(pt => {
                const card = document.createElement("div");
                card.className = "pt-card";

                card.innerHTML = `
                    <div class="pt-info">
                        <p><strong>회원명:</strong> ${pt.memberName}</p>
                        <p><strong>트레이너명:</strong> ${pt.trainerName}</p>
                        <p><strong>초기 등록 PT 횟수:</strong> ${pt.initCount}</p>
                        <p><strong>남은 PT 횟수:</strong> ${pt.remainCount}</p>
                    </div>
                `;

                ptContainer.appendChild(card);
            });
        } catch (error) {
            console.error("PT 목록을 불러오는 중 오류 발생:", error);
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
