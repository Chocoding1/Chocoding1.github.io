<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>리뷰 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/axiosInstance.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">리뷰 작성</h2>

    <form th:action method="post" th:object="${reviewSaveDto}">
        <!-- 트레이너 이름 -->
        <div class="mb-3">
            <label class="form-label">트레이너</label>
            <input type="text" class="form-control" id="trainerName" readonly>
        </div>

        <!-- 리뷰 내용 -->
        <div class="mb-3">
            <label for="content" class="form-label">리뷰 내용</label>
            <textarea id="content" class="form-control" rows="4" required></textarea>
        </div>

        <!-- Hidden 트레이너 ID -->
        <input type="hidden" name="trainerId" th:value="${trainerId}">

        <button type="submit" class="btn btn-primary">등록</button>
        <a href="/pages/ptmembership/ptMembershipList.html" class="btn btn-secondary">취소</a>
    </form>
</div>

<script>
    // 쿼리 파라미터에서 trainerId, trainerName 가져오기
    function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            trainerId: params.get("trainerId"),
            trainerName: params.get("trainerName")
        };
    }

    document.addEventListener("DOMContentLoaded", () => {
        const { trainerId, trainerName } = getQueryParams();

        // 트레이너 이름 표시
        document.getElementById("trainer-name").value = trainerName;

        // 폼 제출 처리
        document.getElementById("review-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const content = document.getElementById("content").value;

            try {
                await axiosInstance.post("/reviews", {
                    trainerId,
                    content
                });

                // 성공 시 리뷰 리스트 페이지로 이동
                window.location.href = "/pages/review/reviewList.html";
            } catch (error) {
                console.error("리뷰 등록 실패:", error);
                alert("리뷰 등록 중 오류가 발생했습니다.");
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
