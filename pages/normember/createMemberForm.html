<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>회원가입</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .field-error {
            border-color: #dc3545;
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header text-center bg-primary text-white">
                    <h4>회원가입</h4>
                </div>
                <div class="card-body">
                    <form>
                        <!-- 이메일 -->
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <div class="input-group">
                                <input type="email" id="email" name="email" class="form-control" placeholder="이메일을 입력하세요">
                                <button type="button" class="btn btn-outline-secondary" onclick="sendEmailCode()">이메일 인증</button>
                            </div>
                            <div id="emailError" class="text-danger small d-none"></div>
                        </div>

                        <!-- 이메일 인증코드 -->
                        <div id="emailVerification" class="mb-3 d-none">
                            <label for="code" class="form-label">이메일 인증코드</label>
                            <div class="input-group">
                                <input type="text" id="code" name="code" class="form-control" placeholder="인증코드를 입력하세요">
                                <button type="button" class="btn btn-outline-secondary" onclick="verifyEmailCode()">확인</button>
                            </div>
                            <div id="verificationMessage" class="text-danger mt-1"></div>
                        </div>

                        <!-- 비밀번호 -->
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요">
                            <div id="passwordError" class="text-danger small d-none"></div>
                        </div>

                        <!-- 이름 -->
                        <div class="mb-3">
                            <label for="name" class="form-label">이름</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="이름을 입력하세요">
                            <div id="nameError" class="text-danger small d-none"></div>
                        </div>

                        <!-- 성별 -->
                        <div class="mb-3">
                            <label class="form-label">성별</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" id="male" value="MALE">
                                <label class="form-check-label" for="male">남성</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" id="female" value="FEMALE">
                                <label class="form-check-label" for="female">여성</label>
                            </div>
                            <div id="genderError" class="text-danger small d-none"></div>
                        </div>

                        <!-- 주소 API -->
                        <div class="mb-3">
                            <label class="form-label">주소</label>
                            <div class="input-group mb-2">
                                <input type="text" id="zoneCode" name="zoneCode" class="form-control" placeholder="우편번호" readonly>
                                <button type="button" class="btn btn-outline-secondary" onclick="sample6_execDaumPostcode()">우편번호 찾기</button>
                            </div>
                            <input type="text" id="address" name="address" class="form-control mb-2" placeholder="주소">
                            <input type="text" id="detailAddress" name="detailAddress" class="form-control mb-2" placeholder="상세주소">
                            <input type="text" id="sample6_extraAddress" class="form-control" placeholder="참고항목">
                            <input type="hidden" id="buildingName" name="buildingName">
                        </div>

                        <!-- 회원가입 버튼 -->
                        <div class="d-grid">
                            <button type="button" class="btn btn-primary" onclick="submitSignup()">회원가입</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <small>이미 계정이 있으신가요? <a href="/static/login.html" class="text-primary">로그인</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- 다음 주소 API -->
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<!-- axios CDN 추가 -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
    <!-- 입력된 주소 데이터 처리 함수 -->
    function sample6_execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                // 각 주소의 노출 규칙에 따라 주소를 조합한다.
                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                var addr = ''; // 주소 변수
                var extraAddr = ''; // 참고항목 변수

                //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
                    addr = data.roadAddress;
                } else { // 사용자가 지번 주소를 선택했을 경우(J)
                    addr = data.jibunAddress;
                }

                // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
                if(data.userSelectedType === 'R'){
                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                    if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                        extraAddr += data.bname;
                    }
                    // 건물명이 있고, 공동주택일 경우 추가한다.
                    if(data.buildingName !== '' && data.apartment === 'Y'){
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                    if(extraAddr !== ''){
                        extraAddr = ' (' + extraAddr + ')';
                    }
                    // 조합된 참고항목을 해당 필드에 넣는다.
                    document.getElementById("sample6_extraAddress").value = extraAddr;

                } else {
                    document.getElementById("sample6_extraAddress").value = '';
                }

                // 우편번호와 주소 정보를 해당 필드에 넣는다.
                document.getElementById('zoneCode').value = data.zonecode;
                document.getElementById("address").value = addr;
                document.getElementById('buildingName').value = data.buildingName;
                // 커서를 상세주소 필드로 이동한다.
                document.getElementById("detailAddress").focus();
            }
        }).open();
    }

    // 입력된 이메일로 인증코드 발송 함수
    function sendEmailCode() {
        const email = document.getElementById('email').value;
        if (!email) {
            alert('이메일을 입력하세요.');
            return;
        }
        // 서버에 인증 코드 요청
        fetch('/api/email/send-code', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email })
        })
        .then(response => response.json())
        .then(data => {
            if (data.data.success) {
                alert('인증 코드가 전송되었습니다.');
                document.getElementById('emailVerification').classList.remove('d-none');
            } else {
                alert(data.message || '인증 코드 전송에 실패했습니다.');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    // 인증코드 검증 함수
    function verifyEmailCode() {
        const email = document.getElementById('email').value;
        const code = document.getElementById('code').value;
        if (!code) {
            alert('인증코드를 입력하세요.');
            return;
        }
        // 서버에 인증 코드 확인 요청
        fetch('/api/email/verify-code', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, code })
        })
        .then(response => response.json())
        .then(data => {
            const messageElem = document.getElementById('verificationMessage');
            if (data.data.success) {
                messageElem.innerText = '인증 성공!';
                messageElem.classList.remove('text-danger');
                messageElem.classList.add('text-success');
            } else {
                messageElem.innerText = data.message || '인증 실패';
                messageElem.classList.remove('text-success');
                messageElem.classList.add('text-danger');
            }
        })
        .catch(error => console.error('Error:', error));
    }
</script>

<script>
    <!-- 회원가입 요청 -->
    function submitSignup() {
      const formData = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        name: document.getElementById('name').value,
        gender: document.querySelector('input[name="gender"]:checked')?.value,
        zoneCode: document.getElementById('zoneCode').value,
        address: document.getElementById('address').value,
        detailAddress: document.getElementById('detailAddress').value,
        buildingName: document.getElementById('buildingName').value,
        emailCode: document.getElementById('code')?.value
      };

      // 기존 에러 메시지 초기화
      clearErrors();

      axios.post('/api/normembers', formData)
        .then(response => {
          // 서버에서 리디렉션이 아닌 JSON 응답을 주도록 바꾸는 게 이상적
          alert('회원가입이 완료되었습니다!');
          window.location.href = '/api/members/login';  // 수동 리디렉션
        })
        .catch(error => {
          if (error.response && error.response.data && error.response.data.data) {
            const errors = error.response.data.data;
            for (const field in errors) {
                    const errorMessage = errors[field];
                    const errorDiv = document.getElementById(field + "Error");
                    if (errorDiv) {
                        errorDiv.textContent = errorMessage;
                        errorDiv.classList.remove('d-none');
                    }
             }
          } else {
              alert('회원가입 도중 오류 발생');
          }
        });
    }

    function clearErrors() {
        const errorFields = ['email', 'password', 'name', 'gender', 'zoneCode', 'address', 'detailAddress'];
        errorFields.forEach(field => {
            const errorDiv = document.querySelector(`#${field}Error`);
            if (errorDiv) {
              errorDiv.textContent = '';
              errorDiv.classList.add('d-none');
            }
        });
    }
</script>
</body>
</html>
