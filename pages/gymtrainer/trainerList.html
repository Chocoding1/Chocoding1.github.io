<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>트레이너 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body {
        background-color: #f8f9fa;
        }

        .card {
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        .trainer-item {
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        }

        .trainer-item:last-child {
        border-bottom: none;
        }

        .section-title {
        margin-bottom: 20px;
        }

        .close-btn {
        margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card p-4">
            <h2 id="gym-title" class="section-title">헬스장 트레이너 목록</h2>

            <ul id="trainer-list" class="list-unstyled"></ul>

            <div class="text-end close-btn">
                <a href="javascript:window.close();" class="btn btn-secondary">창 닫기</a>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gymId = urlParams.get('gymId');
        const gymName = urlParams.get('gymName');

        if (!gymId || !gymName) {
            alert("필수 정보(gymId 또는 gymName)가 누락되었습니다.");
        } else {
            // 제목과 헬스장 이름 표시
            document.getElementById("gym-title").innerText = `${gymName}`;

            // 서버로 트레이너 목록 요청
            axios.get(`http://localhost:8080/api/gymtrainers/${gymId}/trainers`)
                .then(res => {
                    const trainers = res.data.trainers || [];
                    const listElem = document.getElementById('trainer-list');

                    if (trainers.length === 0) {
                        listElem.innerHTML = '<li class="text-muted">등록된 트레이너가 없습니다.</li>';
                        return;
                    }

                    trainers.forEach(trainer => {
                        const li = document.createElement('li');
                        li.className = 'trainer-item';
                        li.innerHTML = `<strong>${trainer.name}</strong> <span class="text-muted">(${trainer.gender})</span>`;
                        listElem.appendChild(li);
                    });
                })
                .catch(err => {
                    console.error(err);
                    alert('트레이너 정보를 불러오지 못했습니다.');
                });
        }
    </script>
</body>
</html>
