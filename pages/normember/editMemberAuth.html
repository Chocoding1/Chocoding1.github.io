<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>비밀번호 확인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/js/axiosInstance.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card {
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }
    .form-control:focus {
      box-shadow: none;
      border-color: #86b7fe;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4">
          <h3 class="mb-3 text-center">비밀번호 확인</h3>
          <p class="text-muted text-center mb-4">회원정보 수정을 위해 비밀번호를 입력하세요.</p>
          <form id="verify-form">
            <div class="mb-3">
              <label for="password" class="form-label">비밀번호</label>
              <input type="password" class="form-control" id="password" placeholder="비밀번호 입력" required />
            </div>
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">확인</button>
              <a href="/pages/normember/myPage.html" class="btn btn-secondary">취소</a>
            </div>
          </form>
          <div id="error-msg" class="mt-3 text-danger text-center d-none">비밀번호가 일치하지 않습니다.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;

      try {
        const userId = localStorage.getItem('userId');
        const res = await axiosInstance.post(`/api/members/${userId}/verify-password`, { password });

        if (res.data.success) {
          location.href = '/pages/normember/editMemberForm.html';
        } else {
          document.getElementById('error-msg').classList.remove('d-none');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('error-msg').classList.remove('d-none');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
