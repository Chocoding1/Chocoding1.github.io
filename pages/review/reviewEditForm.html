<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>리뷰 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/axiosInstance.js"></script>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">리뷰 수정</h2>

    <form id="reviewEditForm">

        <!-- 트레이너 이름 -->
        <div class="mb-3">
            <label class="form-label">트레이너</label>  
            <input type="text" class="form-control" id="trainerName" readonly>
        </div>

        <!-- 리뷰 내용 -->
        <div class="mb-3">
            <label th:for="content" class="form-label">리뷰 내용</label>
            <textarea id="content" name="content" class="form-control" rows="4" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">수정</button> 
        <a href="/pages/review/reviewList.html" class="btn btn-secondary">취소</a>
    </form>
</div>

<script>
    // URL에서 쿼리 파라미터 추출
    const params = new URLSearchParams(window.location.search);
    const reviewId = params.get("reviewId");
    const trainerName = params.get("trainerName");

    // 페이지 로드 시 트레이너 이름 채우기
    document.getElementById("trainerName").value = decodeURIComponent(trainerName || '');

    // 폼 제출 시 PATCH 요청
    document.getElementById("reviewEditForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const content = document.getElementById("content").value;

        try {
            await axiosInstance.patch(`/reviews/${reviewId}`, {
                content: content
            });

            alert("리뷰가 성공적으로 수정되었습니다.");
            location.href = "/pages/review/reviewList.html";
        } catch (error) {
            console.error("리뷰 수정 실패:", error);
            alert("리뷰 수정 중 오류가 발생했습니다.");
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
