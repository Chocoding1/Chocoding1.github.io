<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 변경</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="/js/axiosInstance.js"></script>
  <style>
    .field-error {
      color: #dc3545;
      font-size: 0.875rem;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2 class="mb-4">비밀번호 변경</h2>
  <form id="passwordForm">

    <div class="mb-3">
      <label for="currentPassword" class="form-label">현재 비밀번호</label>
      <input type="password" class="form-control" id="currentPassword" required>
      <div id="currentPasswordError" class="field-error d-none">현재 비밀번호 오류</div>
    </div>

    <div class="mb-3">
      <label for="newPassword" class="form-label">새 비밀번호</label>
      <input type="password" class="form-control" id="newPassword" required>
      <div id="newPasswordError" class="field-error d-none">새 비밀번호 오류</div>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
      <input type="password" class="form-control" id="confirmPassword" required>
      <div id="confirmPasswordError" class="field-error d-none">비밀번호가 일치하지 않습니다</div>
    </div>

    <button type="submit" class="btn btn-primary">비밀번호 변경</button>
  </form>
</div>

<script>
  const newPasswordInput = document.getElementById('newPassword');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const confirmPasswordError = document.getElementById('confirmPasswordError');

  function checkPasswordMatch() {
    if (confirmPasswordInput.value && newPasswordInput.value !== confirmPasswordInput.value) {
      confirmPasswordError.classList.remove('d-none');
    } else {
      confirmPasswordError.classList.add('d-none');
    }
  }

  newPasswordInput.addEventListener('input', checkPasswordMatch);
  confirmPasswordInput.addEventListener('input', checkPasswordMatch);

  document.getElementById('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    // 초기화
    document.querySelectorAll('.field-error').forEach(el => el.classList.add('d-none'));

    const currentPassword = document.getElementById('currentPassword').value.trim();
    const newPassword = newPasswordInput.value.trim();
    const confirmPassword = confirmPasswordInput.value.trim();
    const userId = localStorage.getItem('userId');

    if (newPassword !== confirmPassword) {
      confirmPasswordError.classList.remove('d-none');
      return;
    }

    try {
      const res = await axiosInstance.post(`normembers/${userId}/password`, {
        currentPassword,
        newPassword,
        confirmPassword
      });

      if (res.data.success) {
        alert('비밀번호가 성공적으로 변경되었습니다.');
        location.href = '/pages/normember/myPage.html';
      } else {
        document.getElementById('currentPasswordError').textContent = res.data.message || '비밀번호 확인 실패';
        document.getElementById('currentPasswordError').classList.remove('d-none');
      }

    } catch (error) {
      console.error('비밀번호 변경 실패:', error);
      alert('서버 오류가 발생했습니다.');
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
