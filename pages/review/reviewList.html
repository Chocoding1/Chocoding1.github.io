<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>작성한 리뷰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/axiosInstance.js"></script>
    <style>
        .review-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            position: relative;
        }
        .review-card .review-header {
            font-weight: bold;
        }
        .review-card .review-content {
            margin-top: 10px;
            white-space: pre-wrap;
        }
        .review-card .review-footer {
            text-align: right;
            margin-top: 15px;
        }
        .review-card .review-footer button {
            margin-left: 5px;
        }
        .section-divider {
            border-top: 2px solid #ddd;
            margin: 30px 0;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h3 class="mb-4">작성한 리뷰</h3>

    <!-- 리뷰 리스트 -->
    <div id="reviewContainer">

    </div>

    <!-- 리뷰가 없을 때 -->
    <p id="emptyMessage" class="text-muted" style="display: none;">작성한 리뷰가 없습니다.</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const userId = localStorage.getItem('userId'); // 로그인된 사용자 ID
        const container = document.getElementById('reviewContainer');
        const emptyMessage = document.getElementById('emptyMessage');

        try {
            const response = await axiosInstance.get(`normembers/${userId}/reviews`);
            const reviews = response.data.data;

            if (!reviews || reviews.length === 0) {
                emptyMessage.style.display = 'block';
                return;
            }

            reviews.forEach(review => {
                const card = document.createElement('div');
                card.className = 'review-card';

                card.innerHTML = `
                    <div class="review-header">
                        <span><strong>회원 이름:</strong> ${review.memberName}</span> |
                        <span><strong>트레이너 이름:</strong> ${review.trainerName}</span>
                    </div>

                    <div class="review-content">
                        <p>${review.content}</p>
                    </div>

                    <div class="review-dates mt-2">
                        <span><strong>최초 작성 일자:</strong> ${formatDateTime(review.createdDateTime)}</span> |
                        <span><strong>마지막 수정 일자:</strong> ${formatDateTime(review.modifiedDateTime)}</span>
                    </div>

                    <div class="review-footer">
                        <a href="/pages/review/edit.html?id=${review.id}" class="btn btn-sm btn-primary">수정</a>
                        <button class="btn btn-sm btn-danger" onclick="deleteReview(${review.id}, this)">삭제</button>
                    </div>
                `;

                container.appendChild(card);

                const divider = document.createElement('hr');
                divider.className = 'section-divider';
                container.appendChild(divider);
            });
        } catch (error) {
            console.error('리뷰 목록 조회 실패:', error);
            alert('리뷰 데이터를 불러오지 못했습니다.');
        }
    });

    function formatDateTime(dateTime) {
        if (!dateTime) return '';
        const d = new Date(dateTime);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function pad(n) {
        return n.toString().padStart(2, '0');
    }

    async function deleteReview(reviewId, button) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        try {
            await axiosInstance.delete(`/reviews/${reviewId}`);
            const card = button.closest('.review-card');
            const divider = card.nextElementSibling;
            card.remove();
            if (divider && divider.classList.contains('section-divider')) {
                divider.remove();
            }
            // 남은 리뷰 없으면 메시지 출력
            if (document.querySelectorAll('.review-card').length === 0) {
                document.getElementById('emptyMessage').style.display = 'block';
            }
        } catch (error) {
            console.error('삭제 실패:', error);
            alert('리뷰 삭제 중 오류가 발생했습니다.');
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
