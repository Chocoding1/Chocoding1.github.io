<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- axios CDN 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/axiosInstance.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            height: 100%;
            width: 180px;
        }
        .menu {
            list-style: none;
            padding: 0;
        }
        .menu-item {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #000;
            border: 1px solid #ddd;
            margin-bottom: 5px;
            border-radius: 5px;
            text-align: center;
            background-color: #f1f1f1;
            width: 100%;
        }
        .menu-item:hover {
            background-color: #e2e6ea;
        }
        .menu-item.text-danger {
            color: #dc3545;
        }
        .section-divider {
            border-top: 2px solid #ddd;
            margin: 30px 0;
        }
        .logout-button {
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>
<body>

<!-- 로그아웃 버튼 -->
<div class="logout-button">
    <form id="logout-form" style="margin: 0;">
        <button type="submit" class="btn btn-danger">로그아웃</button>
    </form>
</div>

<div class="container mt-5">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3">
            <div class="sidebar">
                <ul class="menu">
                    <li>
                        <a href="/pages/ptmembership/ptMembershipList.html" class="menu-item">진행 중인 PT</a>
                    </li>
                    <li>
                        <a href="/pages/review/reviewList.html" class="menu-item">내가 쓴 리뷰</a>
                    </li>
                    <li> <!-- 고쳐야됨 -->
                        <form th:action="@{/member/delete-account}" method="post" style="margin: 0;">
                            <button type="submit" class="menu-item text-danger">회원 탈퇴</button>
                        </form>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Content -->
        <div class="col-md-9">
            <!-- Profile Section -->
            <div id="profile">
                <h3 class="mb-3">프로필</h3>
                <div class="mb-2"><strong>이름:</strong> <span id="name">name</span></div>
                <div class="mb-2"><strong>성별:</strong> <span id="gender">gender</span></div>
                <div class="mb-2"><strong>이메일:</strong> <span id="email">email</span></div>
                <div class="mb-2"><strong>비밀번호:</strong> <span id="password">password</span></div>
                <div class="mb-2">
                    <h4>주소</h4>
                    <div><strong>우편번호:</strong> <span id="zoneCode">zoneCode</span></div>
                    <div><strong>주소:</strong> <span id="address">address</span></div>
                    <div><strong>건물명:</strong> <span id="buildingName">buildingName</span></div>
                    <div><strong>상세주소:</strong> <span id="detailAddress">detailAddress</span></div>
                </div>
                <a href="/pages/normember/deitMemberForm.html" class="btn btn-primary">정보 수정</a>
            </div>
        </div>
    </div>
</div>

<script>
  // 페이지 로드 시 회원정보 요청
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const res = await axiosInstance.get('http://localhost:8080/api/members/info'); // API 엔드포인트는 실제 백엔드에 맞게 수정하세요
      const member = res.data.data;

      document.getElementById('name').textContent = member.name || '-';
      document.getElementById('gender').textContent = member.gender || '-';
      document.getElementById('email').textContent = member.email || '-';
      document.getElementById('password').textContent = '********'; // 실제 비밀번호는 절대 표시하지 마세요

      const address = member.address || {};
      document.getElementById('zoneCode').textContent = address.zoneCode || '-';
      document.getElementById('address').textContent = address.address || '-';
      document.getElementById('buildingName').textContent = address.buildingName || '-';
      document.getElementById('detailAddress').textContent = address.detailAddress || '-';

    } catch (err) {
      console.error('회원정보 가져오기 실패:', err);
      alert('회원 정보를 불러오지 못했습니다. 로그인 상태를 확인해주세요.');
      // location.href = '/pages/member/loginMemberForm.html'; // 로그인 페이지로 이동
    }
  });
</script>

<script>
    document.getElementById('logout-form').onsubmit = async (e) => {
        e.preventDefault();

        try {
            // RT 추출
            const refreshToken = localStorage.getItem('refreshToken');
            // 서버에 로그아웃 요청
            await axiosInstance.post('http://localhost:8080/logout', {}, {
                headers: {
                    'Authorization-Refresh': refreshToken
                },
                withCredentials: true
            });
        } catch (error) {
            console.error('서버 로그아웃 실패:', error);
        }

        // 클라이언트에서 토큰 제거
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');

        location.href = '/'; // 홈으로 이동
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
