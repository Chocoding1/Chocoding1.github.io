<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>회원 정보 수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 다음 주소 API -->
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <!-- axios CDN 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/axiosInstance.js"></script>
    <style>
        .field-error {
            border-color: #dc3545;
            color: #dc3545;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">회원 정보 수정</h2>
    <form id="editForm">
        <!-- Password 변경 버튼 -->
        <div class="mb-3">
            <label class="form-label">비밀번호</label><br>
            <button type="button" class="btn btn-outline-primary" onclick="goToChangePassword()">비밀번호 변경</button>
        </div>

        <!-- Name -->
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" id="name" name="name" class="form-control" required>
            <div id="nameError" class="text-danger mt-1" style="display: none;">
                이름 오류
            </div>
        </div>

        <!-- 주소 API -->
        <div class="mb-3">
            <label class="form-label">주소</label>
            <div class="input-group mb-2">
                <input type="text" id="zoneCode" name="zoneCode" class="form-control" placeholder="우편번호" readonly>
                <button type="button" class="btn btn-outline-secondary" onclick="sample6_execDaumPostcode()">우편번호 찾기</button>
            </div>
            <input type="text" id="address" name="address" class="form-control mb-2" placeholder="주소">
            <input type="text" id="detailAddress" name="detailAddress" class="form-control mb-2" placeholder="상세주소">
            <input type="text" id="sample6_extraAddress" class="form-control" placeholder="참고항목">
            <input type="hidden" id="buildingName" name="buildingName">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">저장</button>
    </form>
</div>


<script>
    const form = document.getElementById('editForm');
    form.addEventListener('submit', async function (e) {
        e.preventDefault(); // 폼 제출 시 새로고침 방지

        // 예시: 사용자 ID 가져오기 (필요 시 서버에서 받거나 localStorage 등 사용)
        const userId = localStorage.getItem('userId'); // 또는 const userId = 123;

        // 입력값 수집
        const formData = {
            password: document.getElementById('password').value,
            name: document.getElementById('name').value,
            zoneCode: document.getElementById('zoneCode').value,
            address: document.getElementById('address').value,
            detailAddress: document.getElementById('detailAddress').value,
            buildingName: document.getElementById('buildingName').value
        };

        try {
            const response = await axiosInstance.patch(`trainers/${userId}`, formData);
            alert('회원 정보가 성공적으로 수정되었습니다.');
            // 필요시 리디렉션 등 추가
            location.href='/pages/trainer/myPage.html';
        } catch (error) {
            console.error('수정 실패:', error);

            // 예시: 필드 오류 처리
            if (error.response && error.response.data && error.response.data.errors) {
                const errors = error.response.data.data;
                if (errors.password) {
                    document.getElementById('passwordError').textContent = errors.password;
                    document.getElementById('password').classList.add('field-error-border');
                } else {
                    document.getElementById('passwordError').textContent = '';
                    document.getElementById('password').classList.remove('field-error-border');
                }
                if (errors.name) {
                    document.getElementById('nameError').textContent = errors.name;
                    document.getElementById('name').classList.add('field-error-border');
                } else {
                    document.getElementById('nameError').textContent = '';
                    document.getElementById('name').classList.remove('field-error-border');
                }
            } else {
                alert('알 수 없는 오류가 발생했습니다.');
            }
        }
    });

    function sample6_execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                // 각 주소의 노출 규칙에 따라 주소를 조합한다.
                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                var addr = ''; // 주소 변수
                var extraAddr = ''; // 참고항목 변수

                //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
                    addr = data.roadAddress;
                } else { // 사용자가 지번 주소를 선택했을 경우(J)
                    addr = data.jibunAddress;
                }

                // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
                if(data.userSelectedType === 'R'){
                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                    if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                        extraAddr += data.bname;
                    }
                    // 건물명이 있고, 공동주택일 경우 추가한다.
                    if(data.buildingName !== '' && data.apartment === 'Y'){
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                    if(extraAddr !== ''){
                        extraAddr = ' (' + extraAddr + ')';
                    }
                    // 조합된 참고항목을 해당 필드에 넣는다.
                    document.getElementById("sample6_extraAddress").value = extraAddr;

                } else {
                    document.getElementById("sample6_extraAddress").value = '';
                }

                // 우편번호와 주소 정보를 해당 필드에 넣는다.
                document.getElementById('zoneCode').value = data.zonecode;
                document.getElementById("address").value = addr;
                document.getElementById('buildingName').value = data.buildingName;
                // 커서를 상세주소 필드로 이동한다.
                document.getElementById("detailAddress").focus();
            }
        }).open();
    }

    function goToChangePassword() {
        location.href = '/pages/trainer/changePasswordForm.html';
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
